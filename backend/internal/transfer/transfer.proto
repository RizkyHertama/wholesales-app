syntax = "proto3";
package transfer;

import "google/protobuf/timestamp.proto";

service TransferService {
  rpc CreateTransfer(CreateTransferRequest) returns (CreateTransferResponse);
  rpc GetTransferHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
}

message CreateTransferRequest {
  string trace_id = 1;
  int32 from_company_id = 2;
  string to_bank_code = 3;
  string to_account_number = 4;
  double amount = 5;
  string method = 6;
}

message CreateTransferResponse {
  bool success = 1;
  string message = 2;
  Transfer transfer = 3;
}

message Transfer {
  int64 id = 1;
  string trace_id = 2;
  int32 from_company_id = 3;
  int32 to_company_id = 4;
  string to_bank_code = 5;
  string to_account_number = 6;
  double amount = 7;
  string method = 8;
  string status = 9;
  double fee = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp processed_at = 12;
}

message GetHistoryRequest {
  int32 company_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetHistoryResponse {
  repeated Transfer transfers = 1;
}

message GetBalanceRequest {
  int32 company_id = 1;
}

message GetBalanceResponse {
  double balance = 1;
}
