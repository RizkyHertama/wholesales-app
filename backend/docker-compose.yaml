version: "3.8"

services:
  db:
    image: postgres:16
    container_name: wholesales_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: wholesales_db
    ports:
      - "5432:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d wholesales_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:

