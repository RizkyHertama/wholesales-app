syntax = "proto3";
package wholesales.common;
option go_package = "github.com/RizkyHertama/wholesales-app/backend/internal/common;commonpb";

message Empty {}

message Pagination {
  int32 page = 1;
  int32 per_page = 2;
}

enum TransferMethod {
  UNKNOWN_METHOD = 0;
  BI_FAST = 1;
  RTGS = 2;
  INTERNAL = 3;
  EXTERNAL = 4;
}

enum TransferStatus {
  UNKNOWN_STATUS = 0;
  PENDING = 1;
  SUCCESS = 2;
  FAILED = 3;
}
