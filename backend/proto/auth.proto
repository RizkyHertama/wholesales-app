syntax = "proto3";
package wholesales.auth;
option go_package = "github.com/RizkyHertama/wholesales-app/backend/internal/auth;authpb";

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 expires_at = 2;
}

service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
}
