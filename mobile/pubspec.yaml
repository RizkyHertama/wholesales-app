name: wholesales_mobile
description: Wholesales App Mobile

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  dio: ^5.4.0

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # Storage (token JWT)
  flutter_secure_storage: ^9.0.0

  # UI
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  intl: ^0.19.0 # format currency & date

  # Dependency Injection
  get_it: ^7.6.7

  # Form Validation
  formz: ^0.7.0

  # Environment Config
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
